apiVersion: apps/v1
kind: Deployment

metadata:
  name: bms-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: bms

  template:
    metadata:
      labels:
        app: bms

    spec:
      containers:
        - name: bms-container
          image: rahulf121/bms:latest

          ports:
            - containerPort: 80
